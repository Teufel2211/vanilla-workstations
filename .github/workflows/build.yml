name: build

on:
  push:
    branches: ["main", "mc/**"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  # Fabric: Pflicht, muss gruen sein (alle Versionen verifiziert).
  # Loom 1.18.2 braucht JVM 25 + Gradle >= 9.7 (Plugin-API 9.7.0); Code-Target bleibt 21.
  fabric:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - run: gradle :fabric:build --no-daemon

  # NeoForge + Forge: experimentell bis lokal verifiziert (siehe Issue #1).
  # Gleiche Runtime (JVM 25), damit Settings-Konfiguration (:fabric) nicht schon failt.
  loaders-experimental:
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      matrix:
        module: [":neoforge:build", ":forge:build"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - run: gradle ${{ matrix.module }} --no-daemon

  # Nur GitHub Releases. Kein Modrinth/CurseForge-Publish.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fabric]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - run: gradle :fabric:remapJar --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          files: fabric/build/libs/*.jar
          generate_release_notes: true
