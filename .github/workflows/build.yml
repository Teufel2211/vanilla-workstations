name: build

on:
  push:
    branches: ["main", "mc/**"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  # Fabric: Pflicht, muss gruen sein (alle Versionen verifiziert).
  # Loom 1.18.2 braucht JVM 25 + Gradle >= 9.7 (Plugin-API 9.7.0); Code-Target bleibt 21.
  fabric:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - run: gradle :fabric:build --no-daemon

  # Matrix: EIN Run baut alle MC-Linien x Loader. Versionen je Kombi per -P-Override
  # (Skripte lesen alles via providers.gradleProperty). Pins gegen Maven verifiziert
  # (Stand 2026-09-22, Details docs/support-matrix.md). Nur geschlossene Saetze:
  # Fabric braucht Yarn (kein Yarn fuer 26.x -> kein Fabric-26.x); Forge nur 1.21.x;
  # NeoForge-26.3 nur Beta -> 26.3 ausgelassen. Include-Liste statt mc-x-loader-Kartesisch,
  # weil Deps pro MC-Linie unterschiedlich pinnen (kein exclude noetig).
  # Runtime fix JVM 25 (Loom-1.18.2-Pflicht); -Pjava_version steuert das Code-Target
  # (21 fuer 1.21.x, 25 fuer 26.x). fail-fast:false -> volle Status-Tabelle pro Run.
  # Artefakte nur als Build-Artefakte (NICHT im GitHub Release).
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.1"
            loader: fabric
            module: ":fabric:build"
            yarn: "1.21.1+build.3"
            fapi: "0.109.0+1.21.1"
            neo: "21.1.251"
            forge: "52.1.9"
            java: "21"
          - mc: "1.21.1"
            loader: neoforge
            module: ":neoforge:build"
            yarn: "1.21.1+build.3"
            fapi: "0.109.0+1.21.1"
            neo: "21.1.251"
            forge: "52.1.9"
            java: "21"
          - mc: "1.21.1"
            loader: forge
            module: ":forge:build"
            yarn: "1.21.1+build.3"
            fapi: "0.109.0+1.21.1"
            neo: "21.1.251"
            forge: "52.1.9"
            java: "21"
          - mc: "1.21.4"
            loader: fabric
            module: ":fabric:build"
            yarn: "1.21.4+build.8"
            fapi: "0.119.4+1.21.4"
            neo: "21.4.157"
            forge: "54.1.8"
            java: "21"
          - mc: "1.21.4"
            loader: neoforge
            module: ":neoforge:build"
            yarn: "1.21.4+build.8"
            fapi: "0.119.4+1.21.4"
            neo: "21.4.157"
            forge: "54.1.8"
            java: "21"
          - mc: "1.21.4"
            loader: forge
            module: ":forge:build"
            yarn: "1.21.4+build.8"
            fapi: "0.119.4+1.21.4"
            neo: "21.4.157"
            forge: "54.1.8"
            java: "21"
          - mc: "1.21.8"
            loader: fabric
            module: ":fabric:build"
            yarn: "1.21.8+build.1"
            fapi: "0.136.1+1.21.8"
            neo: "21.8.54"
            forge: "58.1.9"
            java: "21"
          - mc: "1.21.8"
            loader: neoforge
            module: ":neoforge:build"
            yarn: "1.21.8+build.1"
            fapi: "0.136.1+1.21.8"
            neo: "21.8.54"
            forge: "58.1.9"
            java: "21"
          - mc: "1.21.8"
            loader: forge
            module: ":forge:build"
            yarn: "1.21.8+build.1"
            fapi: "0.136.1+1.21.8"
            neo: "21.8.54"
            forge: "58.1.9"
            java: "21"
          - mc: "1.21.11"
            loader: fabric
            module: ":fabric:build"
            yarn: "1.21.11+build.6"
            fapi: "0.141.6+1.21.11"
            neo: "21.11.45"
            forge: "61.2.1"
            java: "21"
          - mc: "1.21.11"
            loader: neoforge
            module: ":neoforge:build"
            yarn: "1.21.11+build.6"
            fapi: "0.141.6+1.21.11"
            neo: "21.11.45"
            forge: "61.2.1"
            java: "21"
          - mc: "1.21.11"
            loader: forge
            module: ":forge:build"
            yarn: "1.21.11+build.6"
            fapi: "0.141.6+1.21.11"
            neo: "21.11.45"
            forge: "61.2.1"
            java: "21"
          # 26.x: Gradle konfiguriert ALLE Module (settings.gradle), :fabric loest
          # Yarn schon in der Config-Phase auf. Da kein Yarn-26.x existiert, steht
          # hier das neueste echte Yarn als reiner Config-Platzhalter (fabric wird
          # in diesen Zeilen nie gebaut); Forge-Koordinate ebenfalls echt.
          - mc: "26.1.2"
            loader: neoforge
            module: ":neoforge:build"
            yarn: "1.21.11+build.6"
            fapi: "0.155.3+26.1.2"
            neo: "26.1.2.109"
            forge: "64.1.3"
            java: "25"
          - mc: "26.2"
            loader: neoforge
            module: ":neoforge:build"
            yarn: "1.21.11+build.6"
            fapi: "0.161.0+26.2"
            neo: "26.2.0.88"
            forge: "65.1.3"
            java: "25"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - name: Build ${{ matrix.loader }} fuer MC ${{ matrix.mc }}
        run: >
          gradle
          -Pminecraft_version=${{ matrix.mc }}
          -Pyarn_mappings=${{ matrix.yarn }}
          -Pfabric_api_version=${{ matrix.fapi }}
          -Pneoforge_version=${{ matrix.neo }}
          -Pforge_version=${{ matrix.forge }}
          -Pjava_version=${{ matrix.java }}
          ${{ matrix.module }} --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: vanilla-workstations-${{ matrix.mc }}-${{ matrix.loader }}
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: warn

  # Autotag: bei jedem main-Push automatisch Patch-Tag erstellen (vX.Y.Z -> vX.Y.(Z+1))
  # + Release im SELBEN Run bauen (GITHUB_TOKEN-Tag-Push triggert per GitHub-Design
  # keinen neuen Run -> Tag-Run kaeme nie; manueller v*-Push nutzt weiter release-Job).
  # Kein Loop: dieser Job laeuft per if nur auf main-Heads, nie auf Tag-Refs.
  autotag:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Auto-tag patch release
        run: |
          git fetch --tags
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.1.0"
            echo "No v* tag found, using base $LATEST"
          fi
          echo "Latest tag: $LATEST"
          VERSION=${LATEST#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          PATCH=$((PATCH + 1))
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next tag: $NEXT"
          if git rev-parse "$NEXT" >/dev/null 2>&1; then
            echo "::error::Tag $NEXT already exists (race). Aborting."
            exit 1
          fi
          git tag "$NEXT" && git push origin "$NEXT"
          echo "NEXT_TAG=$NEXT" >> $GITHUB_ENV
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - name: Build Loader-Jars fuer Auto-Release
        run: |
          MOD_VERSION=${NEXT_TAG#v}
          echo "Building $NEXT_TAG (mod_version=$MOD_VERSION)"
          gradle -Pmod_version=$MOD_VERSION :fabric:remapJar :neoforge:build :forge:build --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEXT_TAG }}
          files: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            forge/build/libs/*.jar
          generate_release_notes: true

  # Nur GitHub Releases. Kein Modrinth/CurseForge-Publish.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fabric]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - name: Version aus Tag ableiten
        run: echo "MOD_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - run: gradle -Pmod_version=$MOD_VERSION :fabric:remapJar :neoforge:build :forge:build --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            forge/build/libs/*.jar
          generate_release_notes: true
