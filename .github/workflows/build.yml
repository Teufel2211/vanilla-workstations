name: build

on:
  push:
    branches: ["main", "mc/**"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  # Fabric: Pflicht, muss gruen sein (alle Versionen verifiziert).
  # Loom 1.18.2 braucht JVM 25 + Gradle >= 9.7 (Plugin-API 9.7.0); Code-Target bleibt 21.
  fabric:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - run: gradle :fabric:build --no-daemon

  # Matrix: EIN Run baut alle MC-Versionen x Loader (Owner-Vorgabe Vollmatrix).
  # 17 MC-Versionen: 1.21, 1.21.1-1.21.11, 26.1, 26.1.1, 26.1.2, 26.2, 26.3.
  # Loader: fabric, neoforge, forge (Quilt via Fabric-Jar). 50 Zeilen:
  # 17x3 minus forge-1.21.2 (kein Artefakt in Forge-Maven).
  # 26.x-Fabric laeuft ueber :fabric26 (No-Remap-Loom `net.fabricmc.fabric-loom`,
  # keine Mappings, `implementation` statt `modImplementation`, Artefakt aus
  # `jar`/`build` statt remapJar). 26.1+ ist unobfusziert (Mojang liefert
  # lesbaren Code); Yarn/Intermediary sind tot (enden bei 1.21.11, Yarn-Repo
  # 2025 deprecated), darum KEIN Yarn/Intermediary-26.x und KEINE
  # Mojang-client_mappings fuer 26.x (Loom-1.18.2 "Failed to find official
  # mojang mappings for 26.x", Run 35748824609). Belege:
  # https://docs.fabricmc.net/develop/porting/mappings,
  # https://fabricmc.net/2025/10/31/obfuscation.html,
  # https://github.com/FabricMC/fabric-loom/issues/1585.
  # Pins = NEUESTE Koordinate je Linie, per Invoke-WebRequest gegen Maven verifiziert
  # (Stand 2026-09-25, Details docs/support-matrix.md). Beta/RC wo noetig:
  # NeoForge ohne stabile Linie -> neueste Beta (21.2.1-beta, 21.6.20-beta,
  # 21.7.25-beta, 21.9.16-beta, 26.1.0.19-beta, 26.1.1.15-beta, 26.3.0.8-beta).
  # Forge-26.x EXPLIZIT gewuenscht (26.1-62.0.9 bis 26.3-66.0.2 aus Forge-Maven,
  # userdev-JARs per HEAD verifiziert 200).
  # Fabric-Loader: 0.16.14 fuer 1.21.x (Baseline-Default), 0.19.5 fuer 26.x
  # (kanonisch per fabric-example-mod/26.1); -Pfabric_loader_version je Zeile
  # (floader-Key; leere Werte fallen im Skript auf den Default zurueck).
  # Fuer 26.x-neoforge/forge official=true (mit --configure-on-demand werden
  # :fabric/:fabric26 bei fremden Zielen gar nicht konfiguriert).
  # --configure-on-demand: Gradle konfiguriert nur das Ziel-Modul. Ohne das wuerde
  # JEDER Job :forge-Mavenizer (userdev-Download) + :fabric-Loom anstossen und
  # Forge-Maven wuerde unter 50 parallelen Jobs mit Timeouts abbrechen
  # (Run 35748824609: alle 50 Matrix-Jobs X, 0 gruen, Mavenizer-Timeout
  # fuer 1.21.1-52.1.16 trotz existierendem userdev-200).
  # Auslassungen (je mit hartem Beleg, kein Vermutung):
  # - forge-1.21.2: maven-metadata.xml enthaelt NULL <version> mit 1.21.2
  #   (gepruefte URL siehe support-matrix.md).
  # Include-Liste statt Kartesisch, weil Deps pro MC-Linie unterschiedlich pinnen.
  # Runtime fix JVM 25 (Loom-1.18.2-Pflicht); -Pjava_version steuert Code-Target
  # (21 fuer 1.21.x, 25 fuer 26.x). fail-fast:false -> volle Status-Tabelle pro Run.
  # Artefakte nur als Build-Artefakte (NICHT im GitHub Release).
  # Upload-Pfad nennt beide Fabric-Moduldirs (je Job existiert nur eins).
