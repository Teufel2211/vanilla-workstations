name: build

on:
  push:
    branches: ["main", "mc/**"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  # Fabric: Pflicht, muss gruen sein (alle Versionen verifiziert).
  # Loom 1.18.2 braucht JVM 25 + Gradle >= 9.7 (Plugin-API 9.7.0); Code-Target bleibt 21.
  fabric:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - run: gradle :fabric:build --no-daemon

  # NeoForge + Forge: experimentell bis lokal verifiziert (siehe Issue #1).
  # Gleiche Runtime (JVM 25), damit Settings-Konfiguration (:fabric) nicht schon failt.
  loaders-experimental:
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      matrix:
        module: [":neoforge:build", ":forge:build"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - run: gradle ${{ matrix.module }} --no-daemon

  # Autotag: bei jedem main-Push automatisch Patch-Tag erstellen (vX.Y.Z -> vX.Y.(Z+1))
  # + Release im SELBEN Run bauen (GITHUB_TOKEN-Tag-Push triggert per GitHub-Design
  # keinen neuen Run -> Tag-Run kaeme nie; manueller v*-Push nutzt weiter release-Job).
  # Kein Loop: dieser Job laeuft per if nur auf main-Heads, nie auf Tag-Refs.
  autotag:
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Auto-tag patch release
        run: |
          git fetch --tags
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.1.0"
            echo "No v* tag found, using base $LATEST"
          fi
          echo "Latest tag: $LATEST"
          VERSION=${LATEST#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          PATCH=$((PATCH + 1))
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Next tag: $NEXT"
          if git rev-parse "$NEXT" >/dev/null 2>&1; then
            echo "::error::Tag $NEXT already exists (race). Aborting."
            exit 1
          fi
          git tag "$NEXT" && git push origin "$NEXT"
          echo "NEXT_TAG=$NEXT" >> $GITHUB_ENV
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - name: Build Loader-Jars fuer Auto-Release
        run: |
          MOD_VERSION=${NEXT_TAG#v}
          echo "Building $NEXT_TAG (mod_version=$MOD_VERSION)"
          gradle -Pmod_version=$MOD_VERSION :fabric:remapJar :neoforge:build :forge:build --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEXT_TAG }}
          files: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            forge/build/libs/*.jar
          generate_release_notes: true

  # Nur GitHub Releases. Kein Modrinth/CurseForge-Publish.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fabric]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - name: Version aus Tag ableiten
        run: echo "MOD_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - run: gradle -Pmod_version=$MOD_VERSION :fabric:remapJar :neoforge:build :forge:build --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            forge/build/libs/*.jar
          generate_release_notes: true
