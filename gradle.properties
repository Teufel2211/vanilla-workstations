# Mod
mod_id = vanilla_workstations
mod_name = Vanilla Workstations
mod_version = 0.1.0
mod_group = de.teufel2211.workstations
mod_author = Teufel2211
mod_description = Nutzlose Bloecke sinnvoll machen: Fletching Table, Hopper-Filter, Composter-Fix. Vanilla-Fit.
mod_license = MIT

# Baseline: 1.21.1 (main). 1.21.4 / 26.x als Branches mc/<version>.
# Alle Versionen unten sind gegen Maven verifiziert (Stand Sep 2026).
minecraft_version = 1.21.1
yarn_mappings = 1.21.1+build.3

# Loader
fabric_loader_version = 0.16.14
fabric_api_version = 0.109.0+1.21.1
neoforge_version = 21.1.251
forge_version = 52.1.9
quilt_loader_version = 0.26.4

# Toolchain (alle gegen Plugin-Portal/Maven verifiziert)
# Hinweis: FG7 braucht Gradle >= 9.3, Loom 1.18.2 braucht Gradle >= 9.7 (Plugin-API 9.7.0) + JVM 25.
# Darum Gradle 9.7.1 (aktuell Sep 2026) + CI-Runtime JVM 25; Code-Target bleibt 21.
fabric_loom_version = 1.18.2
neoforge_moddev_version = 2.0.147
forge_gradle_version = 7.0.40
gradle_version = 9.7.1

# Java: 21 als Code-Target fuer 1.21.x (source/targetCompatibility), 25 fuer 26.x.
# CI-Gradle-Runtime ist JVM 25 (Loom 1.18.2-Pflicht), siehe docs/support-matrix.md
java_version = 21

org.gradle.jvmargs = -Xmx3G
org.gradle.parallel = true
org.gradle.caching = true
